name: VPN Gate Node Check

on:
  # 定时检测: 目标每 30 分钟一次。
  # ⚠ GitHub 的 schedule 事件不保证准时: 官方文档明确说明高负载时会延迟,
  #   负载过高时排队中的运行会被直接丢弃。本仓库实测 `*/30` 实际只会
  #   每隔数小时才真正触发一次(父仓库同样症状)。
  #   这里把分钟数从 0/30 改到 7/37, 避开官方点名的整点高负载窗口,
  #   只降低被延迟的概率, 并不能保证 30 分钟精度。
  # 需要严格 30 分钟节奏时, 请用外部定时器(路由器/NAS/服务器 crontab)
  # 调用 workflow_dispatch 或 repository_dispatch, 不要依赖 schedule:
  #   curl -X POST -H "Authorization: Bearer <PAT,需 Actions:write>" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/wuchen-beifeng/gate/actions/workflows/check.yml/dispatches \
  #     -d '{"ref":"main"}'
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gate-check]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "https://fff.678985211.xyz/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "trigger: ${{ github.event_name }}"
          echo "site: https://wuchen-beifeng.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"
